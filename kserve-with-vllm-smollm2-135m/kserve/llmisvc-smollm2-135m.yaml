apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: smollm2-135m
spec:
  model:
    uri: hf://HuggingFaceTB/SmolLM2-135M-Instruct
    name: HuggingFaceTB/SmolLM2-135M-Instruct
  replicas: 1
  labels:
    llm-d.ai/engine-type: vllm
  router:
    gateway:
      refs:
        - name: inference-gateway
          namespace: llm-d
    route: {}
    scheduler:
      template:
        containers:
          - name: main
            args:
              - --refresh-metrics-interval=1000ms
            resources:
              requests:
                cpu: "500m"
                memory: 1Gi
              limits:
                cpu: "2000m"
                memory: 2Gi
  template:
    containers:
      - name: main
        image: vllm/vllm-openai-cpu:v0.32.0
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: false
        env:
          - name: VLLM_CPU_KVCACHE_SPACE
            value: "1"
          - name: VLLM_ADDITIONAL_ARGS
            value: "--max-model-len 8192 --enforce-eager --enable-auto-tool-choice --tool-call-parser=hermes"
        resources:
          limits:
            cpu: "2000m"
            memory: 4Gi
            ephemeral-storage: 2Gi
          requests:
            cpu: "2000m"
            memory: 4Gi
            ephemeral-storage: 2Gi
        startupProbe:
          failureThreshold: 240
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
        livenessProbe:
          failureThreshold: 3
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        readinessProbe:
          failureThreshold: 3
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
