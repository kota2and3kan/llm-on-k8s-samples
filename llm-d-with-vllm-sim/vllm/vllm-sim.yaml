apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-sim
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vllm-sim
  template:
    metadata:
      labels:
        app: vllm-sim
        llm-d.ai/engine-type: vllm
    spec:
      initContainers:
      - name: vllm-render
        image: vllm/vllm-openai-cpu:v0.32.0
        imagePullPolicy: IfNotPresent
        restartPolicy: Always
        command:
        - vllm
        args:
        - launch
        - render
        - Qwen/Qwen3-0.6B
        - --port=8082
        ports:
        - name: http-render
          containerPort: 8082
          protocol: TCP
        startupProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 2
          periodSeconds: 1
          failureThreshold: 600
          timeoutSeconds: 1
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          periodSeconds: 10
          failureThreshold: 5
          timeoutSeconds: 1
        readinessProbe:
          httpGet:
            path: /health
            port: 8082
          periodSeconds: 5
          failureThreshold: 5
          timeoutSeconds: 1
        resources:
          requests:
            cpu: "1000m"
            memory: "1Gi"
            ephemeral-storage: 1Gi
          limits:
            cpu: "2000m"
            memory: "2Gi"
            ephemeral-storage: 2Gi
      containers:
      - name: vllm-sim
        image: ghcr.io/llm-d/llm-d-inference-sim:v1.0.0
        imagePullPolicy: IfNotPresent
        args:
        - --model
        - Qwen/Qwen3-0.6B
        - --port
        - "8000"
        - --render-url
        - http://localhost:8082
        - --max-model-len
        - "8192"
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: "10m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
